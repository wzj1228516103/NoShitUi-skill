name: Deploy UI showcase to GitHub Pages

on:
  push:
    branches: [showcase-source]
    paths:
      - ui-atlas-demo/**
      - shadcn-demo/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shadcn-demo/package-lock.json

      - name: Build shadcn/ui example
        run: npm ci --prefix shadcn-demo

      - name: Compile shadcn/ui example
        run: npm run build --prefix shadcn-demo

      - name: Prepare static website
        run: |
          mkdir _site
          rsync --archive --exclude='output/' ui-atlas-demo/ _site/
          mv _site/index.html _site/resources.html
          find _site -type f -name '*.html' -exec sed -i 's/href="index.html"/href="resources.html"/g' {} +
          mkdir -p _site/shadcn-demo
          rsync --archive shadcn-demo/dist/ _site/
          rsync --archive shadcn-demo/dist/ _site/shadcn-demo/
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
